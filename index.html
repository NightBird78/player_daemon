<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <meta charset="UTF-8">
    <title>Adv WS Player</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #03dac6;
            --text: #e0e0e0;
            --action-color: #bb86fc;
            --response-color: #4caf50;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            cursor: default;
        }

        .header-panel {
            display: flex;
            gap: 10px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto 20px auto;
        }

        input, select {
            background: var(--card-bg);
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        input { flex-grow: 1; }
        select { color: var(--accent); font-weight: bold; }

        button {
            padding: 10px 25px;
            background: #222;
            color: #555;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 1s;
        }

        button:hover:not(:disabled) { transform: scale(1.05); }
        button:disabled { cursor: default; background: #222 }

        .send-btn {
            background: var(--accent);
            color: var(--bg-color);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 300px;
            gap: 20px;
            flex-grow: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            min-height: 0;
            max-height: 500px;
        }

        .log-container {
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
            overflow: hidden;
        }

        .log-header {
            padding: 10px 15px;
            background: #252525;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }

        .log-box {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: 'Consolas', monospace;
            font-size: 13px;
        }

        .entry { margin-bottom: 8px; line-height: 1.4; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .time { color: #666; font-size: 11px; margin-right: 5px; }
        .act-tag { color: var(--action-color); }
        .res-tag { color: var(--response-color); }

        .player-card {
            background: linear-gradient(145deg, #1e1e1e, #121212);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            height: fit-content;
        }

        .player-card.active .placeholder-fill { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .player-card.passive .placeholder-fill { background: var(--action-color); box-shadow: none; }
        .player-card.stopped .placeholder-fill { background: #333; }
        
        .player-card.active .btn-circle { background: var(--accent); }
        .player-card.passive .btn-circle { background: var(--action-color); }
        .player-card.stopped .btn-circle { background: #222; } 

        .queue-clouds {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
        }

        .queue-item {
            background: linear-gradient(145deg, #1e1e1e, #121212);
            border: 1px solid #333;
            color: var(--text);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeIn 0.3s ease;
            width: 100%;
        }

        .track-info { text-align: center; margin-bottom: 20px; width: 100%; }
        #current-track { 
            font-weight: bold; 
            font-size: 14px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: block;
        }
        #player-status { color: var(--accent); font-size: 12px; }

        .progress-container { width: 100%; margin: 15px 0; }
        .placeholder-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            position: relative;
        }
        .placeholder-fill {
            position: absolute;
            width: 0%;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent);
            transition: width 3s ease-out;
        }

        .controls { display: flex; gap: 15px; align-items: center; }
        .btn-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #555;
        }
        .btn-circle .mdi {
            font-size: 24px; /* Розмір іконки */
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <select id="actionSelect">
            <option value="play">Play</option>
            <option value="playlist">Playlist</option>
        </select>
        <input type="text" id="messageInput" placeholder="URL або назва треку...">
        <button id="sendBtn" class="send-btn" onclick="sendInputMessage()">Додати</button>
    </div>

    <div class="main-grid">
        <div class="log-container">
            <div class="log-header" style="color: var(--action-color)">Actions Log</div>
            <div id="action-log" class="log-box"></div>
        </div>

        <div class="log-container">
            <div class="log-header" style="color: var(--response-color)">Response Log</div>
            <div id="response-log" class="log-box"></div>
        </div>
        <div>
            <div class="player-card">
                <div class="track-info">
                    <span id="player-status">Очікування...</span>
                    <span id="current-track">Немає активного треку</span>
                </div>
    
                <div class="progress-container">
                    <div class="placeholder-bar">
                        <div id="progressBarFill" class="placeholder-fill"></div>
                    </div>
                </div>
    
                <div class="controls">
                    <button id="stop-btn" class="btn-circle stopped" onclick="sendControl('stop')">
                        <span class="mdi mdi-stop"></span>
                    </button>
                    <button id="stop-btn" class="btn-circle stopped" onclick="sendControl('shuffle')">
                        <span class="mdi mdi-shuffle-variant"></span>
                    </button>
                    <button id="pause-btn" class="btn-circle stopped" id="playPauseBtn" onclick="sendControl('pause')">
                        <span class="mdi mdi-play-pause"></span>
                    </button>
                    <button id="next-btn" class="btn-circle stopped" onclick="sendControl('next')">
                        <span class="mdi mdi-skip-next"></span>
                    </button>
                </div>
    
                <div style="margin-top: 15px; font-size: 11px; color: #555;">
                    Queue: <span id="queue-count">0/0</span> | Passive: <span id="passive-count">0/0</span>
                </div>
            </div>
            <div id="queue-cloud-container" class="queue-clouds">
            </div>
        </div>
    </div>

    <script>
        const actionLog = document.getElementById('action-log');
        const responseLog = document.getElementById('response-log');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const progressBar = document.getElementById('progressBarFill');

        const stopBtn = document.getElementById('stop-btn')
        const pauseBtn = document.getElementById('pause-btn')
        const nextBtn = document.getElementById('next-btn')

        stopBtn.disabled = true
        pauseBtn.disabled = true
        nextBtn.disabled = true
        
        sendBtn.disabled = true
        let socket;

        function connect() {
            socket = new WebSocket(`ws://${window.location.host}/ws`);

            socket.onopen = () => {
                addLog(responseLog, "З'єднання встановлено", "res-tag");
                sendBtn.disabled = false;

                stopBtn.disabled = false;
                pauseBtn.disabled = false;
                nextBtn.disabled = false;
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.debug(data)
                    handleServerData(data);
                } catch (e) {
                    addLog(responseLog, event.data, "res-tag");
                }
            };

            socket.onclose = () => {
                addLog(responseLog, "З'єднання розірвано. Перепідключення...", "res-tag");
                sendBtn.disabled = true;

                stopBtn.disabled = true
                pauseBtn.disabled = true
                nextBtn.disabled = true

                progressBar.style.width = "0%";
                updatePlayerUI({"Status": "Stopped"})
                setTimeout(connect, 3000);
            };
        }

        function updatePlayerUI(data) {
            const isStopped = data.status === "Stopped";

            const playerCard = document.querySelector('.player-card');
            
            let currentState = 'stopped';
            
            if (!isStopped) {
                currentState = data.mode
                stopBtn.disabled = false;
                pauseBtn.disabled = false;
                nextBtn.disabled = false;
            }
        
            playerCard.classList.remove('active', 'passive', 'stopped');
            playerCard.classList.add(currentState);

            document.getElementById('queue-count').innerText = isStopped ? '0/0' : `${(data.active_size || 0) > 0 ? data.active_index + 1 : 0}/${data.active_size || 0}`;
            document.getElementById('passive-count').innerText = isStopped ? '0/0' : `${(data.passive_size || 0) > 0 ? data.passive_index + 1 : 0}/${data.passive_size || 0}`;
            document.getElementById('player-status').innerText = isStopped ? "Очікування..." : (data.status || "---");

            const trackTitle = !isStopped && data.metadata?.title ? data.metadata.title : "Немає активного треку";
            document.getElementById('current-track').innerText = trackTitle;

            const cloudContainer = document.getElementById('queue-cloud-container');
            cloudContainer.innerHTML = ''; // Очищуємо старі хмарки
        
            if (!isStopped && data.queue && Array.isArray(data.queue)) {
                data.queue.forEach((track, index) => {
                    const span = document.createElement('span');
                    span.className = 'queue-item';
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'track-title';
                    titleDiv.innerText = track.title || "Unknown Track";
                    
                    const artistDiv = document.createElement('div');
                    artistDiv.className = 'track-artist';
                    artistDiv.innerText = track.artist || "Unknown Artist";
                    
                    span.appendChild(titleDiv);
                    span.appendChild(artistDiv);
                    
                    cloudContainer.appendChild(span);
                });
            }
        }
        
        function handleServerData(data) {
            if (data.type === "action") {
                addLog(actionLog, `${data.action} -> ${data.status || 'N/A'}`, "act-tag");
                if (data.action === "Next" || data.action === "Stop/End" || data.action === "init") {

                    progressBar.style.width = "0%";

                }
                if (data.status === "Stopped" || data.action === "Stop/End") {
                    stopBtn.disabled = true
                    pauseBtn.disabled = true
                    nextBtn.disabled = true
                } 
            } else if (data.type === "response") {
                addLog(responseLog, `Status: ${data.status} | Mode: ${data.mode}`, "res-tag");
                if (data.action === "next" || data.action === "stop") {
                    progressBar.style.width = "0%";
                }
                if (data.status === "Stopped") {
                    stopBtn.disabled = true
                    pauseBtn.disabled = true
                    nextBtn.disabled = true
                }
            } else if (data.type === "process") {
        
                if (progressBar && data.percent !== undefined) {
                    const width = Math.min(Math.max(data.percent, 0), 100);
                    progressBar.style.width = width + "%";
                }
                return
            } else if (data.type === "debug") {
                return
            }
        
            updatePlayerUI(data);
        }

        function sendInputMessage() {
            const cmd = document.getElementById('actionSelect').value;
            const url = input.value;
            if (url) {
                sendCommand({ cmd: cmd, url: url });
                input.value = '';
            }
        }

        function sendControl(actionName) {
            sendCommand({ cmd: "control", action: actionName });
        }

        function sendCommand(obj) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(obj));
            }
        }

        function addLog(container, text, className) {
            const div = document.createElement('div');
            div.className = 'entry';
            const now = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="time">[${now}]</span><span class="${className}">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendInputMessage(); });

        connect();
    </script>
</body>
</html>
