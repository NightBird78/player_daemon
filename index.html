<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3E@media (prefers-color-scheme:dark)%7Bcircle,path%7Bstroke:%23fff%7D%7D%3C/style%3E%3Cpath d='m4 19 5-7-5-7m14 11V5l3 1'/%3E%3Ccircle cx='15' cy='16' r='3'/%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adv WS Player</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #03dac6;
            --action-color: #bb86fc;
            --text: #e0e0e0;
            --response-color: #4caf50;
            --panel-bg: #252525;
            --warning: #ffb74d;
            --error: #cf6679;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
            cursor: default;
        }

        .header-panel {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto 20px auto;
        }

        #actionSelect {
            min-width: 100px;
            height: 45px;
        }

        .input-group {
            flex-grow: 1;
            position: relative;
        }

        .split-container {
            display: flex;
            min-width: 150px;
            height: 45px;
        }

        input, select {
            background: var(--card-bg);
            border: 1px solid #333;
            color: white;
            padding: 0 12px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            height: 45px;
            box-sizing: border-box;
        }

        input { width: 100%; }
        select { color: var(--accent); font-weight: bold; cursor: pointer; }

        .send-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .main-action { flex-grow: 1; border-radius: 8px 0 0 8px; }
        .arrow-toggle { border-radius: 0 8px 8px 0; border-left: 1px solid rgba(0,0,0,0.1); padding: 0 10px; }
        .send-btn:hover:not(:disabled) { opacity: 0.9; }
        .send-btn:disabled { background: #333 !important; color: #666; cursor: not-allowed; }

        .main-grid {
            display: grid;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            grid-template-columns: 1fr 1fr 320px;
        }

        .log-container {
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
            height: 450px;
        }

        .log-header {
            padding: 12px 15px;
            background: var(--panel-bg);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            border-radius: 12px 12px 0 0;
        }

        .log-box {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }
        .close-logs { margin-bottom: 15px; background: #333; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold;}

        .entry { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #222; }
        .time { color: #666; font-size: 10px; margin-right: 5px; }
        .act-tag { color: var(--action-color); }
        .res-tag { color: var(--response-color); }
        .warn-tag { color: var(--warning); }

        .player-card {
            background: linear-gradient(145deg, #1e1e1e, #121212);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: sticky;
            top: 20px;
        }

        .player-card.active .placeholder-fill { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .player-card.passive .placeholder-fill { background: var(--action-color); box-shadow: 0 0 10px var(--action-color); }
        .player-card.active #player-status { color: var(--accent); }
        .player-card.passive #player-status { color: var(--action-color); }
        .player-card.stopped .placeholder-fill { background: #333; }

        .track-info { 
            text-align: center; 
            margin-bottom: 20px; 
            width: 100%; 
            overflow: hidden; 
            position: relative;
        }
        
        .track-ticker-wrapper {
            display: block;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 5px;
            position: relative;
        }

        #current-track { 
            font-weight: bold; 
            font-size: 16px; 
            display: inline-block;
            padding-left: 0;
            transition: transform 0.5s ease;
        }

        #current-track.marquee {
            padding-left: 100%;
            animation: ticker 10s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        #player-status { font-size: 12px; text-transform: uppercase; font-weight: bold; }

        .progress-container { width: 100%; margin: 20px 0; }
        .placeholder-bar { height: 6px; background: #333; border-radius: 3px; position: relative; overflow: hidden; }
        .placeholder-fill { position: absolute; width: 0%; height: 100%; transition: width 0.5s linear; }

        .controls { display: flex; gap: 12px; justify-content: center; width: 100%; }
        .btn-circle { 
            width: 55px; height: 55px; border-radius: 50%; border: none; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 25px; color: white; cursor: pointer; 
            background: #2a2a2a; transition: 1s; 
        }
        
        .player-card.active .btn-circle:not(:disabled) { color: var(--accent); }
        .player-card.passive .btn-circle:not(:disabled) { color: var(--action-color); }
        .btn-circle:hover:not(:disabled) { background: #444; transform: scale(1.05); }
        .btn-circle:disabled { opacity: 0.2; cursor: default; }

        .queue-clouds { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; width: 100%; overflow-y: auto; }
        #queue-cloud-container {
            overflow-y: auto;
            overflow-x: visible;
            position: relative;
        }
        .queue-item { 
            background: #1e1e1e; 
            border: 1px solid #333; 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 13px; 
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .item-menu-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 20px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            height: 100%;
        }
        .queue-item-content {
            flex-grow: 1;
            overflow: hidden;
        }
        .item-menu-btn:hover {
            color: white;
        }
        .item-dropdown {
            position: fixed;
            right: 10px;
            top: 40px;
            background: var(--panel-bg);
            border: 1px solid #444;
            border-radius: 8px 8px 0;
            z-index: 200;
            max-width: 180px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
        }
        
        .item-dropdown.show {
            display: flex;
        }
        
        .item-dropdown button {
            width: 100%;
            padding: 10px 16px;
            text-align: left;
            background: none;
            color: var(--text);
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .item-dropdown button.action-next {
            color: var(--accent);
            font-weight: bold;
        }        
        .item-dropdown button:hover {
            background: #333;
        }
        
        .item-dropdown button.action-next {
            color: var(--accent);
            font-weight: bold;
        }

        .queue-item.active { border-left: 4px solid var(--accent); }


        .queue-item.passive { border-left: 4px solid var(--action-color); }

        /* --- Dropdown --- */
        .dropdown-wrapper { position: relative; display: flex; }
        .dropdown-content {
            position: absolute;
            top: 110%;
            right: 0; 
            background: var(--card-bg);
            border: 1px solid #333; 
            border-radius: 8px;
            z-index: 100;
            min-width: 140px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);

            opacity: 0;
            transform: translateY(-5px);
            pointer-events: none;
            
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dropdown-content button { width: 100%; padding: 12px; border-radius: 8px; text-align: left; background: none; color: white; border: none; cursor: pointer;}
        .dropdown-content button:hover { background: #333; }
        .dropdown-content.show { 
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .show { display: block !important; }

        /* --- Search Results Dropdown --- */
        .search-results-dropdown {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            z-index: 150;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none;
        }
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: #252525; }
        .search-thumb {
            width: 50px;
            height: 38px;
            object-fit: cover;
            border-radius: 4px;
            background: #333;
        }
        .search-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }
        .search-title {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-duration {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
        }

        /* --- Mobile Specifics --- */
        .mobile-log-trigger {
            display: none; position: fixed; bottom: 20px; right: 20px; 
            z-index: 1000; width: 60px; height: 60px; border-radius: 50%;
            background: var(--action-color); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .logs-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 2000; flex-direction: column; padding: 15px; box-sizing: border-box;
        }
        .logs-modal.active { display: flex; }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr 1fr; }
            .player-card-wrapper { grid-column: span 2; }
            .player-card { position: static; }
        }

        @media (max-width: 600px) {
            .header-panel {
                flex-wrap: wrap;
            }
            #actionSelect {
                flex: 1;
            }
            .split-container {
                flex: 1;
            }
            .input-group {
                width: 100%;
                order: 3;
            }
            .main-grid { grid-template-columns: 1fr; }
            .log-container.desktop-only { display: none; }
            .mobile-log-trigger { display: flex; }
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <select id="actionSelect">
            <option value="play">Play</option>
            <option value="playlist">Playlist</option>
        </select>

        <div class="input-group">
            <input type="text" id="messageInput" placeholder="URL або назва треку...">
            <div id="searchResults" class="search-results-dropdown"></div>
        </div>

        <div class="split-container">
            <button id="sendBtn" class="send-btn main-action" onclick="searchInputMessage()" disabled>Шукати</button>
            <div class="dropdown-wrapper">
                <button id="arrowBtn" class="send-btn arrow-toggle" onclick="toggleDropdown(event)" disabled>
                    <span class="mdi mdi-chevron-down"></span>
                </button>
                
                <div id="dropdown-elements" class="dropdown-content">
                    <button onclick="sendInputMessage()">Додати</button>
                    <button onclick="sendListMessage()">Локальне</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-grid">
        <div class="log-container desktop-only">
            <div class="log-header" style="color: var(--action-color)">Actions Log</div>
            <div id="action-log" class="log-box"></div>
        </div>

        <div class="log-container desktop-only">
            <div class="log-header" style="color: var(--response-color)">Response Log</div>
            <div id="response-log" class="log-box"></div>
        </div>

        <div class="player-card-wrapper">
            <div class="player-card stopped">
                <div class="track-info">
                    <span id="player-status">Очікування...</span>
                    <div class="track-ticker-wrapper">
                        <span id="current-track">Немає активного треку</span>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="placeholder-bar">
                        <div id="progressBarFill" class="placeholder-fill"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-circle" title="Stop" onclick="sendControl('stop')" id="stop-btn" disabled>
                        <span class="mdi mdi-stop"></span>
                    </button>
                    <button class="btn-circle" title="Shuffle" onclick="sendControl('shuffle')" id="shuffle-btn" disabled>
                        <span class="mdi mdi-shuffle-variant"></span>
                    </button>
                    <button class="btn-circle" title="Pause" onclick="sendControl('pause')" id="pause-btn" disabled>
                        <span class="mdi mdi-play-pause"></span>
                    </button>
                    <button class="btn-circle" title="Next" onclick="sendControl('next')" id="next-btn" disabled>
                        <span class="mdi mdi-skip-next"></span>
                    </button>
                </div>

                <div style="margin-top: 20px; font-size: 11px; color: #666; width: 100%; text-align: center; border-top: 1px solid #222; padding-top: 10px;">
                    Queue: <span id="queue-count">0/0</span> | Passive: <span id="passive-count">0/0</span>
                </div>

                <div id="queue-cloud-container" class="queue-clouds"></div>
            </div>
        </div>
    </div>

    <button class="mobile-log-trigger send-btn" onclick="toggleMobileLogs()">
        <span class="mdi mdi-text-box-outline" style="font-size: 24px;"></span>
    </button>

    <div id="logsModal" class="logs-modal">
        <button class="close-logs" onclick="toggleMobileLogs()">Закрити логи</button>
        <div style="display: flex; flex-direction: column; gap: 10px; height: 100%; overflow: hidden;">
            <div class="log-container" style="height: 50%;">
                <div id="action-log-mobile" class="log-box"></div>
            </div>
            <div class="log-container" style="height: 50%;">
                <div id="response-log-mobile" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        const actionLog = document.getElementById('action-log');
        const responseLog = document.getElementById('response-log');
        const actionLogMob = document.getElementById('action-log-mobile');
        const responseLogMob = document.getElementById('response-log-mobile');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const arrowBtn = document.getElementById('arrowBtn');
        const progressBar = document.getElementById('progressBarFill');
        const searchResults = document.getElementById('searchResults');
        const playerBtns = ['stop-btn', 'shuffle-btn', 'pause-btn', 'next-btn'].map(id => document.getElementById(id));

        let socket;
        let reconnectTimeout = null;
        let connectionTimeout = null;

        function connect() {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
    
            if (connectionTimeout) {
                clearTimeout(connectionTimeout);
                connectionTimeout = null;
            }

            if (socket) {
                socket.onopen = null;
                socket.onmessage = null;
                socket.onclose = null;
                socket.onerror = null;
                try { socket.close(); } catch(e) {}
            }

            socket = new WebSocket(`ws://${window.location.host}/ws`);

            connectionTimeout = setTimeout(() => {
                if (socket && socket.readyState !== WebSocket.OPEN) {
                    console.log("З'єднання триває занадто довго. Примусове закриття...");
                    socket.onclose = null; 
                    try { socket.close(); } catch(e) {}
            
                handleCloseActions();
                }
            }, 1000);

            socket.onopen = () => {
                if (connectionTimeout) clearTimeout(connectionTimeout);
                addLog(responseLog, responseLogMob, "З'єднання встановлено", "res-tag"); 
                setUIState(true); 
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleServerData(data);
                } catch (e) { addLog(responseLog, responseLogMob, event.data, "res-tag"); }
            };

            socket.onclose = () => {
                handleCloseActions();
            };
    
            socket.onerror = (error) => {
                console.error("Помилка WebSocket:", error);
            };
        }

        function handleCloseActions() {
            if (connectionTimeout) {
                clearTimeout(connectionTimeout);
                connectionTimeout = null;
            }

            setUIState(false);
            updatePlayerUI({status: "Stopped"});
    
            if (!reconnectTimeout) {
                reconnectTimeout = setTimeout(() => { connect(); }, 5000);
            }
        }

        function setUIState(enabled) {
            sendBtn.disabled = !enabled;
            arrowBtn.disabled = !enabled;
            playerBtns.forEach(btn => btn.disabled = !enabled);
        }

        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function handleServerData(data) {
            if (data.type === "action") {
                addLog(actionLog, actionLogMob, `${data.action} -> ${data.status || 'N/A'}`, "act-tag");
                if (["Next", "Stop/End", "init"].includes(data.action)) {
                    progressBar.style.width = `${data.percent || 0}%`;
                }
            } 
            else if (data.type === "response") {
                addLog(responseLog, responseLogMob, `Status: ${data.status} | Mode: ${data.mode}`, "res-tag");
                if (["Next", "Stop/End", "init"].includes(data.action)) progressBar.style.width = "0%";
            } 
            else if (data.type === "process") {
                if (data.percent !== undefined) progressBar.style.width = data.percent + "%";
                return;
            }
            else if (data.type === "warning") {
                addLog(responseLog, responseLogMob, data.warning, "warn-tag");
            }
            else if (data.type === "search_result") {
                addLog(responseLog, responseLogMob, `search result`, "res-tag");
                
                searchResults.innerHTML = '';
                if (data.search_result && data.search_result.length > 0) {
                    data.search_result.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'search-item';
                        div.innerHTML = `
                            <img class="search-thumb" src="${item.thumbnail || ''}" alt="thumb">
                            <div class="search-info">
                                <div class="search-title" title="${item.title}">${item.title}</div>
                                <div class="search-duration">${formatDuration(item.duration)}</div>
                            </div>
                        `;
                        div.onclick = (e) => {
                            e.stopPropagation();
                            sendCommand({ cmd: "play", url: item.url });
                            searchResults.style.display = 'none';
                        };
                        searchResults.appendChild(div);
                    });
                    searchResults.style.display = 'block';
                } else {
                    searchResults.style.display = 'none';
                }
            }
            updatePlayerUI(data);
        }
        function updatePlayerUI(data) {
            const isStopped = data.status === "Stopped";
            
            updateGlobalPlayer(data, isStopped);
            
            renderQueue(data.queue || [], isStopped);
        }
        
        function updateGlobalPlayer(data, isStopped) {
            const playerCard = document.querySelector('.player-card');
            playerCard.className = `player-card ${isStopped ? 'stopped' : (data.mode || 'stopped')}`;
            
            playerBtns.forEach(btn => btn.disabled = isStopped);
            if (isStopped) progressBar.style.width = "0%";
        
            const formatCount = (size, index) => isStopped ? '0/0' : `${size > 0 ? index + 1 : 0}/${size || 0}`;
            document.getElementById('queue-count').innerText = formatCount(data.active_size, data.active_index);
            document.getElementById('passive-count').innerText = formatCount(data.passive_size, data.passive_index);
            document.getElementById('player-status').innerText = isStopped ? "Очікування..." : (data.status || "Грає");
            
            const trackEl = document.getElementById('current-track');
            const newTitle = !isStopped && data.metadata?.title ? data.metadata.title : "Немає активного треку";
            
            trackEl.classList.remove('marquee');
            trackEl.innerText = newTitle;
        
            if (!isStopped && trackEl.scrollWidth > trackEl.parentElement.clientWidth) {
                const duration = Math.max(8, trackEl.scrollWidth / 30); 
                trackEl.style.animationDuration = `${duration}s`;
                trackEl.classList.add('marquee');
            }
        }
        
        function renderQueue(queue, isStopped) {
            const cloudContainer = document.getElementById('queue-cloud-container');
            cloudContainer.innerHTML = '';
            
            if (isStopped) return;
        
            queue.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `queue-item ${track.type}`;
                
                const trackId = track.id !== undefined ? track.id : index;
                const prevTrack = index > 0 ? queue[index - 1] : null;
                const nextTrack = index < queue.length - 1 ? queue[index + 1] : null;
        
                const menuHtml = buildTrackMenuHtml(trackId, track.url, index, queue.length, track.type, prevTrack, nextTrack);
        
                div.innerHTML = `
                    <div class="queue-item-content">
                        <div class="track-title"><b>${track.title || "Unknown"}</b></div>
                        <div class="track-artist">${track.artist || "Unknown Artist"}</div>
                    </div>
                    <button class="item-menu-btn" onclick="toggleItemMenu(event, '${trackId}')">
                        <span class="mdi mdi-dots-vertical"></span>
                    </button>
                    <div id="item-menu-${trackId}" class="item-dropdown">
                        ${menuHtml}
                    </div>
                `;
                cloudContainer.appendChild(div);
            });
        }

        function buildTrackMenuHtml(trackId, trackUrl, index, totalTracks, currentType, prevTrack, nextTrack) {
            const isFirst = index === 0;
            const isSecond = index === 1;
            const isLast = index === totalTracks - 1;
            const isPassive = currentType === 'passive';
        
            const buttons = [];
        
            const escapeHtml = (text) => text.replace(/"/g, '&quot;');
            const safeUrl = escapeHtml(trackUrl);
        
            if (!isFirst) {
                buttons.push(`<button class="action-next" data-action="next" data-url="${safeUrl}" data-type="${currentType}" onclick="sendTrackAction(this.dataset.action, this.dataset.url, this.dataset.type)">Відтворити наступним</button>`);
            }
        
            const canMoveUp = !isFirst && !isSecond && !(isPassive && prevTrack && prevTrack.type === 'active');
            if (canMoveUp) {
                buttons.push(`<button data-action="move_up" data-url="${safeUrl}" data-type="${currentType}" onclick="sendTrackAction(this.dataset.action, this.dataset.url, this.dataset.type)">Перемістити вище</button>`);
            }
        
            const canMoveDown = !isLast && !(!isPassive && nextTrack && nextTrack.type === 'passive');
            if (canMoveDown) {
                buttons.push(`<button data-action="move_down" data-url="${safeUrl}" data-type="${currentType}" onclick="sendTrackAction(this.dataset.action, this.dataset.url, this.dataset.type)">Перемістити нижче</button>`);
            }
        
            const actionType = isPassive ? 'to_active' : 'to_passive';
            const labelType = isPassive ? 'В активні' : 'В пасивні';
            buttons.push(`<button data-action="${actionType}" data-url="${safeUrl}" data-type="${currentType}" onclick="sendTrackAction(this.dataset.action, this.dataset.url, this.dataset.type)">${labelType}</button>`);
        
            if (isPassive) {
                buttons.push(`<button data-action="postpone" data-url="${safeUrl}" data-type="${currentType}" onclick="sendTrackAction(this.dataset.action, this.dataset.url, this.dataset.type)">Відкласти</button>`);
            }
        
            buttons.push(`<button data-action="remove" data-url="${safeUrl}" data-type="${currentType}" onclick="sendTrackAction(this.dataset.action, this.dataset.url, this.dataset.type)" style="color: #ff5252;">Прибрати</button>`);
        
            if (buttons.length > 0) {
                buttons[0] = buttons[0].replace('<button', '<button style="border-radius: 8px 8px 0 0;"');
                
                const lastIndex = buttons.length - 1;
                if (buttons[lastIndex].includes('style=')) {
                    buttons[lastIndex] = buttons[lastIndex].replace('style="', 'style="border-radius: 0 0 0 8px; ');
                } else {
                    buttons[lastIndex] = buttons[lastIndex].replace('<button', '<button style="border-radius: 0 0 0 8px;"');
                }
            }
        
            return buttons.join('\n');
        }        

        function addLog(deskContainer, mobContainer, text, className) {
            const now = new Date().toLocaleTimeString();
            const content = `<div class="entry"><span class="time">[${now}]</span><span class="${className}">${text}</span></div>`;
            [deskContainer, mobContainer].forEach(c => {
                if(c) {
                    c.insertAdjacentHTML('beforeend', content);
                    c.scrollTop = c.scrollHeight;
                }
            });
        }

        function toggleMobileLogs() { document.getElementById('logsModal').classList.toggle('active'); }
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("dropdown-elements").classList.toggle("show");
        }
        
        window.onclick = () => {
            document.getElementById("dropdown-elements").classList.remove("show");
            searchResults.style.display = 'none';
        }

        function sendInputMessage() {
            const cmd = document.getElementById('actionSelect').value;
            if (input.value.trim()) {
                sendCommand({ cmd, url: input.value });
                input.value = '';
            }
        }

        function searchInputMessage() {
            if (input.value.trim()) {
                sendCommand({ cmd: "search", text: input.value });
                input.value = '';
            }
        }

        function toggleItemMenu(event, trackId) {
            event.stopPropagation();
            
            const currentMenu = document.getElementById(`item-menu-${trackId}`);
            const isAlreadyOpen = currentMenu && currentMenu.classList.contains('show');
        
            document.querySelectorAll('.item-dropdown').forEach(menu => {
                menu.classList.remove('show');
            });
        
            if (currentMenu && !isAlreadyOpen) {
                const btnBounds = event.currentTarget.getBoundingClientRect();
        
                currentMenu.classList.add('show');
        
                const menuHeight = currentMenu.offsetHeight;
                currentMenu.style.top = `${btnBounds.top - menuHeight + 15}px`; 
                
                currentMenu.style.left = `${btnBounds.right - 205}px`;
        
                if (btnBounds.right - 180 < 0) {
                    currentMenu.style.left = `10px`;
                }
            }
        }

        function sendTrackAction(action, trackId, type) {
            if (action === "remove") {
                const openMenu = document.getElementById(`item-menu-${trackId}`);
                console.log(openMenu)
                if (openMenu) {
                    const queueItem = openMenu.closest('.queue-item');
                    if (queueItem) {
                        queueItem.remove();
                        
                        const queueCountEl = document.getElementById('queue-count');
                    }
                }
            }
            sendCommand({
                cmd: "queue_action",
                action: action,
                in: type,
                track_id: trackId
            });
            document.querySelectorAll('.item-dropdown').forEach(menu => menu.classList.remove('show'));
        }

        const originalWindowClick = window.onclick;
        window.onclick = function(e) {
            if (typeof originalWindowClick === 'function') originalWindowClick(e);
            hideAllItemMenus();
        };

        document.getElementById('queue-cloud-container').addEventListener('scroll', hideAllItemMenus);

        function hideAllItemMenus() {
            document.querySelectorAll('.item-dropdown').forEach(menu => {
                menu.classList.remove('show');
            });
        }
        function sendControl(action) { sendCommand({ cmd: "control", action }); }
        function sendListMessage() { sendCommand({ cmd: "localplaylist" }); }
        function sendCommand(obj) { if (socket?.readyState === 1) socket.send(JSON.stringify(obj)); }

        input.onkeypress = (e) => { if (e.key === "Enter") searchInputMessage(); };
        
        window.onresize = () => {
            const trackEl = document.getElementById('current-track');
            if (trackEl.innerText !== "Немає активного треку" && trackEl.innerText !== "З'єднання встановлено") {
                trackEl.classList.remove('marquee');
                if (trackEl.scrollWidth > trackEl.parentElement.clientWidth) {
                    trackEl.classList.add('marquee');
                }
            }
        };

        connect();
    </script>
</body>
</html>
